openapi: 3.0.3
info:
  title: Endoz API
  description: API for endoz openbanking platform.
  version: 1.0.0
servers:
  - url: https://endozapi.celergate.net
    description: Sandbox Environment
paths:
  /login/:
    post:
      tags:
        - Authentication
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: The email address of the user.
                  example: test@example.com
                public_key:
                  type: string
                  description: The client public key.
                  example: 1e89ffb6-5a40-4df1-b1b9-ff1c832214f0
                secret_key:
                  type: string
                  description: The client secret key.
                  example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                    description: The access token for the session.
                  refresh:
                    type: string
                    description: The refresh token for the session.
                example:
                  access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ...
                  refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ...
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message describing why the request failed.
                example:
                  detail: Invalid email or public key.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.
  /initiate-payment/:
    post:
      summary: Initiate a payment
      tags:
        - Payments
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: The amount to be paid.
                  example: 5
                currency:
                  type: string
                  description: The currency of the payment.
                  example: "GBP"
                settlement_account:
                  type: string
                  description: The account to settle the payment.
                  example: "987d28af0d"
                transaction_ref:
                  type: string
                  description: Reference for the transaction.
                  example: "34534redf3d00"
                narration:
                  type: string
                  description: A description or reason for the payment.
                  example: "Gift"
                webhook_url:
                  type: string
                  description: URL for webhook notifications related to this payment.
                  example: "https://webhook.site/481927c8-36d7-4cc0-a9de-49562206d9b1"
                redirect_url:
                  type: string
                  description: URL to redirect after payment.
                  example: "https://wikipedia.com"
                payer:
                  type: object
                  description: Information about the payer.
                  properties:
                    first_name:
                      type: string
                      description: First name of the payer.
                      example: "Ahmad"
                    last_name:
                      type: string
                      description: Last name of the payer.
                      example: "Sharafudeen"
                    email_address:
                      type: string
                      description: Email address of the payer.
                      example: "ahmadsharafudeen@gmail.com"
                    address:
                      type: string
                      description: Address of the payer.
                      example: "Lugbe, Abuja"
      responses:
        '200':
          description: Payment initiated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    type: string
                    description: Reference for the payment.
                  hosted_url:
                    type: string
                    description: URL to redirect to for payment.
                example:
                  reference: "202503131111096386ed356c98f9a4"
                  hosted_url: "https://endozpay.celergate.net?payload=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJwYXltZW50X2lkIjo1MywicmVmZXJlbmNlIjoiMzQ1MzRyZWRmM2QwMCIsImFtb3VudCI6NS4wLCJjdXJyZW5jeSI6Ilx1MDBhMyIsImNsaWVudCI6IkVuZG96IERldiJ9.qC5iILRh0zmSD0jMpY4Csv9UZHBZ3sGmcCFipGzz6qs"
        '400':
          description: Bad Request - Invalid data or missing required fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for the bad request.
                example:
                  detail: "Invalid payment details."
        '401':
          description: Unauthorized - Missing or invalid `X-CLIENTID` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message describing the server error.
                example:
                  detail: An internal server error occurred.
  '/payments/{transaction_ref}/':
    get:
      summary: Retrieve payment details
      tags:
        - Payments
      parameters:
        - name: transaction_ref
          in: path
          required: true
          description: Reference for the transaction.
          schema:
            type: string
          example: 34534redf3d00
      responses:
        '200':
          description: Payment details retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the payment.
                    example: 53
                  our_reference:
                    type: string
                    description: Internal reference for the payment.
                    example: "202503131111096386ed356c98f9a4"
                  amount:
                    type: string
                    description: Amount of the payment.
                    example: "5.00"
                  transaction_ref:
                    type: string
                    description: Reference for the transaction.
                    example: "34534redf3d00"
                  currency_code:
                    type: string
                    description: Currency code of the payment.
                    example: "GBP"
                  currency_symbol:
                    type: string
                    description: Currency symbol of the payment.
                    example: "£"
                  narration:
                    type: string
                    description: Description or reason for the payment.
                    example: "Gift"
                  status:
                    type: string
                    description: Status of the payment.
                    example: "PENDING"
                  payer_name:
                    type: string
                    description: Name of the payer.
                    example: ""
                  metadata:
                    type: object
                    description: Additional metadata for the payment.
                    nullable: true
                  webhook_url:
                    type: string
                    description: URL for webhook notifications related to this payment.
                    example: "https://webhook.site/481927c8-36d7-4cc0-a9de-49562206d9b1"
                  redirect_url:
                    type: string
                    description: URL to redirect after payment.
                    example: "https://wikipedia.com"
                  created_on:
                    type: string
                    format: date-time
                    description: Timestamp when the payment was created.
                    example: "2025-03-13T11:11:09.638493Z"
                  institution_code:
                    type: string
                    description: Institution code related to the payment.
                    example: ""
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for missing payment.
                example:
                  detail: "Payment not found."
  '/payments/':
    get:
      summary: Payment history
      tags:
        - Payments
      parameters:
        - name: settlement_account_identifier
          in: query
          required: false
          description: settlement_account_identifier.
          schema:
            type: string
          example: 34534redf3d00
        - name: transaction_ref
          in: query
          required: false
          description: Reference for the transaction.
          schema:
            type: string
          example: 34534redf3d00
      responses:
        '200':
          description: Payment history retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 120
                  next:
                    type: string
                    nullable: true
                    example: null
                  previous:
                    type: string
                    nullable: true
                    example: null
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'

        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for missing payment.
                example:
                  detail: "Payment not found."

  '/payments/{transaction_ref}/refund/':
    get:
      summary: List refunds for a payment
      description: Lists refunds previously issued against a settled payment.
      tags:
        - Refunds
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
        - name: transaction_ref
          in: path
          required: true
          description: Reference for the transaction to list refunds for.
          schema:
            type: string
          example: 34534redf3d00
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Refunds retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundRecord'
        '400':
          description: Bad Request - Payment with this transaction reference was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for the bad request.
                example:
                  detail: "Payment with ID not found."
        '401':
          description: Unauthorized - Missing or invalid `X-CLIENTID` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.
    post:
      summary: Refund a payment
      description: Processes a refund for a previously settled payment. Only allowed while there is sufficient refundable amount left on the payment (amount minus previous completed/processing refunds and withdrawal charges) and sufficient balance in the settlement account.
      tags:
        - Refunds
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
        - name: transaction_ref
          in: path
          required: true
          description: Reference for the settled transaction to refund.
          schema:
            type: string
          example: 34534redf3d00
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - narration
              properties:
                reference:
                  type: string
                  description: Merchant-supplied reference for the refund. Auto-generated if omitted.
                  example: "rf-34534redf3d00"
                amount:
                  type: number
                  description: The amount to refund.
                  example: 5
                narration:
                  type: string
                  description: A description or reason for the refund.
                  example: "Customer requested refund"
                webhook_url:
                  type: string
                  description: URL for webhook notifications related to this refund.
                  example: "https://webhook.site/481927c8-36d7-4cc0-a9de-49562206d9b1"
                metadata:
                  type: object
                  description: Additional metadata for the refund.
                  nullable: true
      responses:
        '201':
          description: Refund created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRecord'
        '400':
          description: Bad Request - Payment not found or not refundable, missing recipient account details, a refund with the given `reference` already exists for this payment, insufficient refundable amount, insufficient settlement account balance, or the refund payout could not be processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for the bad request.
                example:
                  detail: "Insufficient refundable amount. Only 3.50 is available for refund."
        '401':
          description: Unauthorized - Missing or invalid `X-CLIENTID` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.

  '/payments/{transaction_ref}/refundable-amount/':
    get:
      summary: Get refundable amount for a payment
      description: Returns how much of a settled payment is still available to refund, i.e. the payment amount minus amounts already refunded (completed or processing). This does not deduct withdrawal charges, since those depend on the amount you choose to refund - see `GET /settlement-accounts/{identifier}/charges/` for the fee rates.
      tags:
        - Refunds
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
        - name: transaction_ref
          in: path
          required: true
          description: Reference for the settled transaction to check.
          schema:
            type: string
          example: 34534redf3d00
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Refundable amount retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: string
                    description: Original amount of the payment.
                    example: "5.00"
                  total_refunded:
                    type: string
                    description: Total amount already refunded (completed or processing).
                    example: "1.50"
                  refundable_amount:
                    type: string
                    description: Amount still available to refund (amount minus total_refunded).
                    example: "3.50"
                  currency:
                    type: string
                    description: Currency code of the payment.
                    example: "GBP"
        '400':
          description: Bad Request - Payment with this transaction reference was not found or is not refundable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for the bad request.
                example:
                  detail: "Payment with ID not found or is not refundable."
        '401':
          description: Unauthorized - Missing or invalid `X-CLIENTID` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.

  '/withdrawals/{settlement_account_identifier}/':
    get:
      summary: List withdrawals
      tags:
        - Withdrawals
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
        - name: settlement_account_identifier
          in: path
          required: true
          description: Identifier of the settlement account to withdraw from.
          schema:
            type: string
          example: "987d28af0d"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Withdrawals retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 12
                  next:
                    type: string
                    nullable: true
                    example: null
                  previous:
                    type: string
                    nullable: true
                    example: null
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/WithdrawalRecord'
        '401':
          description: Unauthorized - Missing or invalid `X-CLIENTID` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.
    post:
      summary: Create a withdrawal
      tags:
        - Withdrawals
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
        - name: settlement_account_identifier
          in: path
          required: true
          description: Identifier of the settlement account to withdraw from.
          schema:
            type: string
          example: "987d28af0d"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - narration
                - transfer_to
              properties:
                reference:
                  type: string
                  description: Merchant-supplied reference for the withdrawal. Auto-generated if omitted.
                  example: "wd-34534redf3d00"
                amount:
                  type: number
                  description: The amount to withdraw.
                  example: 100
                narration:
                  type: string
                  description: A description or reason for the withdrawal.
                  example: "Monthly payout"
                transfer_to:
                  type: integer
                  description: ID of the recipient bank account to transfer funds to. Create one via `POST /recipients/` and use the returned `id`.
                  example: 7
                webhook_url:
                  type: string
                  description: URL for webhook notifications related to this withdrawal.
                  example: "https://webhook.site/481927c8-36d7-4cc0-a9de-49562206d9b1"
                metadata:
                  type: object
                  description: Additional metadata for the withdrawal.
                  nullable: true
      responses:
        '201':
          description: Withdrawal created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalRecord'
        '400':
          description: Bad Request - Invalid data, insufficient balance, or payout could not be processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for the bad request.
                example:
                  detail: "Insufficient balance in settlement account"
        '401':
          description: Unauthorized - Missing or invalid `X-CLIENTID` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.

  '/recipients/':
    get:
      summary: List recipients
      description: Lists bank account recipients belonging to the authenticated company. Use this to look up an existing recipient's `id`, or create a new one below, before creating a withdrawal.
      tags:
        - Recipients
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
        - name: account_number
          in: query
          required: false
          description: Filter by recipient account number.
          schema:
            type: string
        - name: sortcode
          in: query
          required: false
          description: Filter by recipient sort code.
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recipients retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 4
                  next:
                    type: string
                    nullable: true
                    example: null
                  previous:
                    type: string
                    nullable: true
                    example: null
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipient'
        '401':
          description: Unauthorized - Missing or invalid `X-CLIENTID` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.
    post:
      summary: Create a recipient
      description: Creates a bank account recipient for the authenticated company. The returned `id` is used as `transfer_to` when creating a withdrawal. `currency` and `company` are inferred server-side and must not be supplied - currency is fixed to GBP.
      tags:
        - Recipients
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_type
                - account_name
                - sortcode
                - account_number
              properties:
                account_type:
                  type: string
                  description: Type of the recipient account. For GBP `personal` accounts, `account_name` must include both a first and last name.
                  enum:
                    - personal
                    - business
                  example: "personal"
                account_name:
                  type: string
                  description: Name on the recipient bank account.
                  example: "John Doe"
                sortcode:
                  type: string
                  description: Recipient sort code.
                  example: "04-00-04"
                account_number:
                  type: string
                  description: Recipient account number.
                  example: "00123456"
                bank_name:
                  type: string
                  description: Recipient bank name.
                  example: "Barclays"
                swift_bic:
                  type: string
                  description: SWIFT/BIC code of the recipient bank.
                  example: "BARCGB22"
                address:
                  type: string
                  description: Recipient's address.
                  example: "1 Churchill Place"
                city:
                  type: string
                  description: Recipient's city.
                  example: "London"
                country_code:
                  type: string
                  description: Recipient's country code.
                  example: "GB"
                mobile_no:
                  type: string
                  description: Recipient's mobile number.
                  example: "+447911123456"
      responses:
        '201':
          description: Recipient created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          description: Bad Request - Invalid data, or a recipient with this account number and sort code already exists for your company.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for the bad request.
                example:
                  detail: "A bank account with this account number already exists for your company."
        '401':
          description: Unauthorized - Missing or invalid `X-CLIENTID` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.

  '/settlement-accounts/{identifier}/balance/':
    get:
      summary: Get settlement account balance
      tags:
        - Settlement Accounts
      parameters:
        - name: X-CLIENTID
          in: header
          required: true
          description: Client identifier for the API.
          schema:
            type: string
          example: sdfgfd-sdfgf4d-sdfgfdsd-sdfgfds
        - name: identifier
          in: path
          required: true
          description: Identifier of the settlement account.
          schema:
            type: string
          example: "987d28af0d"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: string
                    description: Current balance of the settlement account.
                    example: "4500.00"
        '401':
          description: Unauthorized - Missing or invalid `X-CLIENTID` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for unauthorized access.
                example:
                  detail: Missing or invalid X-CLIENTID header.
        '404':
          description: Settlement account not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message for missing settlement account.
                example:
                  detail: "Not found."

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Payment:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the payment.
          example: 53
        our_reference:
          type: string
          description: Internal reference for the payment.
          example: "202503131111096386ed356c98f9a4"
        amount:
          type: string
          description: Amount of the payment.
          example: "5.00"
        transaction_ref:
          type: string
          description: Reference for the transaction.
          example: "34534redf3d00"
        currency_code:
          type: string
          description: Currency code of the payment.
          example: "GBP"
        currency_symbol:
          type: string
          description: Currency symbol of the payment.
          example: "£"
        narration:
          type: string
          description: Description or reason for the payment.
